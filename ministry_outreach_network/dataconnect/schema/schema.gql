enum District {
  Central,
  NorthEast,
  NorthWest,
  South
}

type Church @table(key: ["id"]) {
  id: Int!
  name: String!
  address: String!
  hunger: Boolean!
  literacy: Boolean!
  stability: Boolean!
  health: Boolean!
  worshiptime: String!
  livestream: Boolean!
  tags: [String!]!
  disctrict: District!
}